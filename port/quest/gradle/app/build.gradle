// The OpenXR loader comes from Maven Central here (Khronos' prefab AAR); build_apk.sh
// builds the same loader from source instead.
plugins { id "com.android.application" }

def quest = file("../..")   // port/quest
def withGame = (project.findProperty("blackvr.withGame") ?: "false").toBoolean()

android {
    namespace "com.kenny.blackvr"
    compileSdk 34
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "com.kenny.blackvr"
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DOPENXR_SDK_DIR=" + file(project.findProperty("openxr.sdk")).absolutePath,
                          "-DBLACKVR_USE_PREFAB_LOADER=ON",
                          "-DBLACKVR_WITH_GAME=" + (withGame ? "ON" : "OFF")
            }
        }
    }
    buildFeatures { prefab true }
    sourceSets {
        main {
            manifest.srcFile new File(quest, "AndroidManifest.xml")
            res.srcDirs = [new File(quest, "res")]
        }
    }
    externalNativeBuild {
        cmake { path new File(quest, "CMakeLists.txt"); version "3.22.1+" }
    }
    packagingOptions { jniLibs { useLegacyPackaging false } }
    buildTypes {
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }
}

dependencies {
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.49"
}
